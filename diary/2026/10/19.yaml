verses:
  "5:14":
    - "Después de esto Jesús lo halló* en el templo y le dijo: «Mira, has sido sanado; no peques más, para que no te suceda algo peor»."
  "5:15":
    - "El hombre se fue, y dijo a los judíos que Jesús era el que lo había sanado."
  "5:16":
    - "A causa de esto los judíos persuguían a Jesús, porque hacía estas cosas en el día de reposo."
  "5:17":
    - "Pero Jesús les respondió: «Hasta ahora Mi Padre trabaja, y Yo también trabajo»."
  "5:18":
    - "Entonces, por esta causa, los judíos aún más procuraban matar a Jesús, poerque no solo violava el día de reposo,"
    - "sino que también llamaba a Dios Su propio Padre, haciéndose igual a Dios."
