verses:
  "4:46":
    - "イエスは、再びガリラヤのカナに行かれた。そこは、前にイエスが水をぶどう酒に変えられた所である。"
    - "さて、カファルナウムに王の役人たいて、その息子が病気であった。"
  "4:47":
    - "その人は、イエスがユダヤからガリラヤに来られたと聞き、イエスのもとに行き、カファルナウムまで下って来て息子をいやしてくださるように頼んだ。"
    - "息子が死にかかっていたからである。"
  "4:48":
    - "イエスは役人に、「あなたがたは、するすや不思議な業を見なければ、決して信じない」と言われた。"
