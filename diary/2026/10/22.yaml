grammar:
  おく:
    - type: "Auxiliary verb (attached to the te-form of a main verb)"
    - meaning: "To do in advance / to state definitively and deliberately with future effect in mind"
    - nuance: "Indicates that an action (such as speaking or advising) is performed intentionally, putting the statement firmly on record so the listener keeps it in mind and is prepared for what follows."
    - examples:
      - phrase: "言っておく (itte oku)"
        meaning: "to state clearly and deliberately in advance / to put on record"
      - phrase: "宿題をしておく (shukudai o shite oku)"
        meaning: "to do homework ahead of time (as preparation)"
