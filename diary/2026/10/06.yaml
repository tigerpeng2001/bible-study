verses:
  "4:39":
    - "Y de aquella ciudad, muchos de los samaritanos creyeron en Él por la palabra de la mujer que daba testimonio,"
    - "diciendo: «Él me dijo todo lo que yo he hecho»."
  "4:40":
    - "De modo que cuando los samaritanos vinieron, rogaban a Jesús que se quedara con ellos; y Él se quedó allí dos días."
  "4:41":
    - "Muchos más creyeron por Su palabra."
  "4:42":
    - "y decían a la mujer: «Ya no creemos por lo que tú has dicho. porque nosostros mismos le hemos oído, y sabemos que Este es en verdad el Salvador de mundo»." 
