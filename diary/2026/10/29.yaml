    - "フィリポは、「めいめいが少しずつ食べるためにも、二百デナりオン分のパンでは足りないでしょう」と答えた。"
  "6:8":
    - "弟子の一人で、シモン・ペトロの兄弟アンデルが、イエスに言った。"
  "6:9":
    - "「ここに大麦のパン五つと魚二匹とを待っている少年がいます。けれども、こんなに大勢の人では、何の役にも立たないでしょう。」"
  "6:10":
    - "イエスは、「人々を座らせなさい」と言われた。そこには草がたくさん生えていた。男たちはそこに座ったが、その数はおよそ五千人であった。" 
