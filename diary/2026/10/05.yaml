grammar:
  habrá traído:
    meaning: "expresses a wonder or guess about what might have already happened"
    translations:
        - "Could someone have brought...?"
        - "I wonder if someone brought..."
    term_en: "Conjectural Future"
    term_es: "Futuro de conjetura"
    language: "Spanish"
    definition: >-
      In Spanish, the future tense (specifically the future perfect) is frequently used
      to express probability, speculation, or conjecture about a past event rather than
      indicating a future action.   
