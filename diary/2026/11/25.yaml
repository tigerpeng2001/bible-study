verses:
  "7:25":
    - "さて、エルサレムの人々の中には次のように言う者たちがいた。「これは、人々が殺そうとねらっている者ではないか。"
  "7:26":
    - "あんなに公然と話しているのに、何も言われない。議員たちは、この人がメシアだと言うことを、本当に認めたのではなかろうか。"
  "7:27":
    - "しかし、わたしたちは、この人がどこの出身かを知っている。メシアが来られるときは、どこから来られるのか、だれも知らないはずだ。」"
  "7:28":
    - "そると、神殿の境内で教えていたイエスは、大声で言われた。「あなたたちはわたしのことを知っており、また、どこの出身かも知っている。"
    - "わたしは自分勝手に来たのではない。わたしをお遣わしになった方は真実であるが、あなたたちはその方を知らない。"
