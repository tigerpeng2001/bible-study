  "6:12":
    - "Cuando se saciaron, dijo* a Sus discípulos: «Recojan los pedazos que sobran, para que no se pierda nada»."
  "6:13":
    - "Ellos los recogieron, y llenaron doce cestas con los pedazos de los cinco panes de cebada que sobraron a los que habían comido."
  "6:14":
    - "La gente, entonces, al ver la señal que Jesús había hecho, decía: «Verdaderamente Este es el Profeta que había de venir  al mundo»."
  "6:15":
    - "Por lo que Jesús, dándose cuenta de que iban a venir y por loa fuerza hacerle rey, se retiró Él solo otro vez al monte."
