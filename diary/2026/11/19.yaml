verses:
  "7:10":
    - "しかし、兄弟たちが祭りに上って行ったとき、イエスご自身も、人目を避け、隠れるようにして上って行かれた。"
  "7:11":
    - "祭りのときユダヤ人たちはイエスを捜し、「あの男はどこにいるのか」と言っていた。"
  "7:12":
    - "群衆の間では、イエスのことがいろいろとささやかれていた。「良い人だ」という者もいれば、「うや、群衆を惑わしている」と言う者もいた。"
  "7:13":
    - "しかし、ユダヤ人たちを恐れて、イエスについて公然と語る者はいなかった。" 
