verses:
  "7:20":
    - "La multitud contestó: «¡Tienes un demonio! ¿Quié  te quiere matar?»"
  "7:21":
    - "Jesús les respondió: «Una sola obra hice y todos se admiran."
  "7:22":
    - "Por eso Moisés les ha dado la ciruncisión (no porque sea de Mosisés, sino de los padres),"
    - "y en el día de reposo ustedes circuncidan al hombre."
  "7:23":
    - "Y si para no violar la ley de Moisés un hombre recibe la circuncisión aún en el día de reposo,"
    - "¿por qué están enojados conmigo porque sané por completo a un hombre en el día de reposo?"
  "7:24":
    - "No juzguen por la apariencia, sino juzguen con juicio justo»."
