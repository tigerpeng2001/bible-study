verses:
  "6:52":
    - "それで、ユダヤ人だちは、「どうしてこの人は自分の肉を我々に食べさせることができるのか」と、互いに激しく議論し始めた。"
  "6:53":
    - "イエスは言われた。「はっきり言っておく。人の子の肉を食べ、その血を飲まなければ、あなたたちの内に命はない。"
  "6:54":
    - "わたしの肉を食べ、わたしの血を飲む者は、永遠の命を得、わたしはその者を終わりの日に復活させる。"
  "6:55":
    - "わたしの肉はまことの食べ物、わたしの血はまことの飲み物だからである。"
  "6:56":
    - "わたしの肉を食べ、わたしの血は飲む者は、いつもわたしの内におり、はたしもまたいつもその人の内にいる。"
  "6:57":
    - "生きておられる父がわたしをお遣わしになり、またわたしが父によって生きるように、わたしを食べる者もわたしによって生きる。"
  "6:58":
    - "これは天から降って来たパンである。先祖が食べたのに死んだしまったようなものとは違う。このパンを食べる者は永遠に生きる。」"
  "6:59":
    - "これらは、イエスがカファルナウムの会堂で教えていたときに話されたことである。"
vocabulary:
  互い: "adv. たがい. 互い. each other / mutually"
  激しく: "adv. はげしく. 激しく. intensely / violently"
  議論: "n. ぎろん. 議論. argument / debate / discussion"
