verses:
  "3:27":
    - "ヨハネは答えて言った。「天から与えられなければ、人は何も受けることができない。"
  "3:28":
    - "わたしは、『自分はメシアではない』と言い、『自分はあの方の前に遣わされた者だ』と言ったが、そのことについては、あなたたち自身が証ししてくれる。"
  "3:29":
    - "花嫁を迎えるのは花婿だ。花婿の介添え人はそばに立って耳を傾け、花婿の声が聞こえると大いに喜ぶ。だから、わたしは喜びで満たされている。"
  "3:30":
    - "あの方は栄え、わたしは衰えねばならない。」"
