book: "ヨハネによる福音書"
version: "新共同訳 (日本聖書協会 1987, 1988)"
target_language: "Japanese"
verses:
  "1:35":
    - "その翌日、また、ヨハネは二人の弟子と一緒にいた。"
  "1:36":
    - "そして、歩いておられるイエスを見つめて、「見よ、神の小羊だ」と言った。"
  "1:37":
    - "二人の弟子はそれを聞いて、イエスに従った。"
  "1:38": 
    - "イエスは振り返り、彼らが従って来るのを見て、「何を求めているのか」と言われた。"
    - "彼らが、「ラビ――『先生』という意味――どこに泊まっておられるのですか」と言うと、"
  "1:39":
    - "イエスは、「来なさい。そうすれば分かる」と言われた。"
    - "そこで、彼らはついて行って、どこにイエスが泊まっておられるかを見た。"
    - "そしてその日は、イエスのもとに泊まった。午後四時ごろのことである。"
  "1:40":
    - "ヨハネの言葉を聞いて、イエスに従った二人のうちの一人は、シモン・ペトロの兄弟アンデレであった。"
  "1:41":
    - "彼は、まず自分の兄弟シモンに会って、「わたしたちはメシア――『油を注がれた者』という意味――に出会った」と言った。"
  "1:42":
    - "そして、シモンをイエスのところに連れて行った。イエスは彼を見つめて、"
    - "あなたはヨハネの子シモンであるが、ケファ――『岩』という意味――と呼ぶことにする」と言われた。"
vocabulary:
  そして: "conj. そして. そして. and / then"
  歩いて: "v. 歩く. ある. to walk / to go on foot. te-form"
