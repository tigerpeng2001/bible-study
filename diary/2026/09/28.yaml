grammar:
  "Dame de beber":
  translation: "Give me a drink"
  grammar_breakdown:
    components:
      - word: "Dame"
        gloss: "Give me"
        structure:
          verb:
            base_infinitive: "dar"
            meaning: "to give"
            form: "imperative"
            target: "tú (informal you)"
            conjugated_form: "Da"
          object_pronoun:
            type: "indirect"
            meaning: "to me"
            form: "me"
          syntax_rule: "In affirmative commands, pronouns attach directly to the end of the conjugated verb."
      - word: "de"
        gloss: "of / some"
        function: "partitive preposition"
        usage: "Implies an indefinite quantity or an unspecified amount of a substance ( liquid / water)."
      - word: "beber"
        gloss: "to drink"
        form: "infinitive verb"
    idiomatic_construction:
      pattern: "dar + de + [infinitive]"
      meaning: "to give [someone] something to [verb]"
      examples:
        - expression: "dar de beber"
          meaning: "to give something to drink"
        - expression: "dar de comer"
          meaning: "to feed / to give something to eat"
    structural_formula: "Verb_Command (Imperative) + Object_Pronoun + Preposition + Infinitive"
