date: "2026-09-28"
weekday: "Monday"
book: "Juan"
version: "Nueva Biblia de las Américas (NBLA)"
target_language: "Spanish"
verses:
  "4:1":
    - "Por tanto, cunado el Señor supo que los fariseos habían oído que Él hacía y bautizaba más discipulos que Juan,"
  "4.2":
    - "(aunque Jesús mismo no bautizaba, sino Sus discipulos),"
  "4:3":
    - "salió de Judea y se fue otra vez para Galilea."
  "4:4":
    - "YÉl tenía que apsar por Samaria."
  "4:5":
    - "Llegó, pues, a una ciudad de Samaria llamada Sicar, cerca de la parcela de tirra que Jacob dio a su hijo José;"
  "4:6":
    - "y allí estaba el pozo de Jacob. Entonces Jesús, cansado del camino, se sentó junto al pozo. Era cerca del mediodía."
  "4.7":
    - "Una mujer de Samaria vino* a sacar agua, y Jesús le dijo*: «Dame de beber.»"
  "4:8":
    - "Pues Sus discipulos habían ido a la ciudad a comprar alimentos."
  "4:9":
    - "Entonces la mujer samaritana le dijo*: «¿Cómo es que Tú, siendo judío, me pides de beber a mí, que soy samaritana?»"
  "4:10":
    - "Jesús le respondió: «Si tú conocieras el don de Dios, y quién es el que te dice: “Dame de beber”, "
    - "tú le habría pedido a Él, y Él te hubiera dado agua viva»."
vocabulary:
