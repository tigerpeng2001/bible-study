grammar:
  "lo malo":
  grammatical_components:
    article:
      type: "neuter definite article"
      form: "lo"
      function: "nominalizer / abstracts the adjective"
    adjective:
      root: "malo"
      gender_form: "masculine singular"
      function: "functions as a noun core when combined with 'lo'"
  part_of_speech: "substantivized adjective phrase (abstract noun phrase)"
  meaning:
    literal: "that which is bad"
    translations:
      - "the bad thing"
      - "the bad part"
      - "what is bad"
      - "the downside"
      - "evil / wrongdoing"
  usage_patterns:
    - structure: "lo malo + de + [noun/verb]"
      meaning: "the bad thing / downside about [something]"
      example:
        spanish: "Lo malo de esta película es el final."
        english: "The bad thing about this movie is the ending."
    - structure: "lo malo + es que + [clause]"
      meaning: "the bad thing / problem is that [clause]"
      example:
        spanish: "Lo malo es que no tenemos suficiente tiempo."
        english: "The bad part is that we don't have enough time."
    - structure: "hacer / practicar + lo malo"
      meaning: "to do / practice what is bad or evil"
      example:
        spanish: "Todo el que hace lo malo odia la luz."
        english: "Everyone who does evil hates the light."
  rules:
    - "The adjective following 'lo' must strictly remain in its singular masculine form (malo), never changing for gender or number (*lo mala, *lo malos)."
    - "'Lo' cannot modify standard concrete nouns; it only pairs with adjectives, adverbs, or relative clauses to form abstract concepts."
