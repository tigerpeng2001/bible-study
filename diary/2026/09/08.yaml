grammar:
"se celebró":
  grammar_term: "pasiva_refleja"
  auxiliary_verb: "none (uses reflexive pronoun 'se')"
  main_verb: "celebrar (celebró - preterite, 3rd person singular)"
  meaning:
    literal: "celebrated itself"
    natural: "was celebrated / was held / took place"
  purpose: "expresses the passive voice without 'ser', focusing on the event happening rather than who hosted it"
  comparison_to_fue_invitado: "uses 'se + active verb' instead of 'ser + participle' because the subject (una boda) is an impersonal event rather than a specific person"

"fue invitado":
  grammar_term: "pasiva_analitica"
  auxiliary_verb: "ser (fue - preterite, 3rd person singular)"
  main_verb: "invitar (invitado - past participle)"
  meaning:
    literal: "was invited"
    natural: "was invited"
  purpose: "expresses the standard passive voice, showing that Jesus received the action of being invited"
  comparison_to_se: "uses 'ser + participle' rather than 'se' because the subject (Jesús) is a specific person rather than an impersonal event"

"se acabó":
  grammar_term: "pasiva_refleja / se_intransitivador"
  auxiliary_verb: "none (uses reflexive pronoun 'se')"
  main_verb: "acabar (acabó - preterite, 3rd person singular)"
  meaning:
    literal: "finished itself"
    natural: "ran out / was finished"
  purpose: "expresses a spontaneous or passive event happening to an inanimate object (el vino) without an active human agent"
  comparison_to_se_celebro: "identical structure ('se + verb'), but while 'se celebró' implies an intentional event being held, 'se acabó' expresses a situation or state naturally coming to an end"

"nos interesa esto a ti y a Mí":
  term: "objeto_indirecto_duplicado (reduplicated indirect object)"
  components:
    unstressed_pronoun: "nos (bound pronoun required by the verb)"
    prepositional_phrase: "a ti y a Mí (explicit emphasis/clarification phrase)"
  is_redundant:
    grammatically: "yes (syntactic redundancy)"
    pragmatically: "no (serves distinct structural and stylistic functions)"
  functions:
    1_grammatical_requirement: "In Spanish, whenever an indirect object phrase using 'a + pronoun' comes before or after certain verbs, the weak pronoun ('nos') is structurally obligatory to link the action."
    2_emphatic_stress: "'nos' carries no stress. 'a ti y a Mí' adds strong personal emphasis, highlighting the contrast between their responsibilities and the hosts' dilemma."
    3_clarification: "'nos' means 'us' (which could mean the whole group). 'a ti y a Mí' explicitly specifies the scope to strictly Mary and Jesus."
