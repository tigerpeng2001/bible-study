grammar:
  お咎めになった:
    structure: "お + verb stem + になる"
    type: "Honorific / Polite Form (尊敬語)"
    meaning: "to rebuke / to reproach (honorific form)"
    function: >-
      This structure is used to show respect or politeness when referring to the actions of someone of higher status, such as Jesus in this context. The verb stem is combined with the honorific prefix 'お' and the polite auxiliary 'になる' to convey reverence.
    breakdown:
      お: "Honorific prefix indicating respect"
      とがめ: "Verb stem of 'とがめる' (to rebuke / to reproach)"
      になった: "Polite past form of 'になる' (to become / to do in a respectful manner)"
    example 1:
      verse: "Mark 16:14 (新共同訳)"
      text: "イエスが現れ、その不信仰とかたくなな心をおとがめになった。"
      translation: "Jesus appeared and rebuked their unbelief and stubbornness."
    example 2:
      verse: "Mark 16:20 (新共同訳)"
      text: "主は彼らと共に働き、彼らの語る言葉が真実であることを、それに伴うしるしによってはっきりとお示しになった。"
      translation: "The Lord worked with them and clearly showed that the words they spoke were true by the accompanying signs."
  つげのようなしるし:
    structure: "noun + のような + noun"
    type: "Simile / Metaphorical Expression (比喩表現)"
    meaning: "accompanying signs / evidences (literally 'signs like a herald')"
    function: >-
      This structure is used to create a simile or metaphor, comparing one noun to another using 'のような' (like / similar to). In this context, it describes the signs that accompany believers as being like those of a herald, indicating their significance and authority.
    breakdown:
      noun1: "The first noun being compared (e.g., 'つげ' - herald)"
      のような: "Indicates similarity or likeness (like / similar to)"
      noun2: "The second noun being described (e.g., 'しるし' - sign)"
    example:
      verse: "Mark 16:17 (新共同訳)"
      text: "信じる者には次のようなしるしが伴う。"
      translation: "These signs will accompany those who believe."
