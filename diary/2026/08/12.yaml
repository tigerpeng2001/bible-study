verses:
  "1:10":
    - "人々は非常に恐れ、ヨナに言った。"
    - "「なんという事をしたのだ。」"
    - "人々はヨナが、主の前から逃げて来たことを知った。彼が白状したからである。"
  "1:11":
    - "彼らはヨナに言った。"
    - "「あなたをどうしたら、海が静まるのだろうか。」"
    - "海は荒れる一方だった。"
  "1:12":
    - "ヨナは彼らに言った。"
    - "「わたしの手足を捕らえて海にほうり込むがよい。そうすれば、海は穏やかになる。わたしのせいで、この大嵐があなたたちを見舞ったことは、わたしが知っている。」"
