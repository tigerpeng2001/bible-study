verses:
  "3:8":
    - "人も家畜も粗布をまとい、ひたすら神に祈願せよ。おのおの悪の道を離れ、その手から不法を捨てよ。"
  "3:9":
    - "そうすれば神が思い直されて激しい怒りを静め、我々は滅びを免れるかもしれない。」"
  "3:10":
    - "神は彼らの業、彼らが悪の道を離れたことを御覧になり、思い直され、宣告した災いをくだすのをやめられた。"
