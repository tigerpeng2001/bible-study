verses:
  "1:1":
    - "La palabra del Señor vino a Jonás, hijo de Amitai:"
  "1:2":
    - "«Levántate, ve a Nínive, la gran ciudad, y proclama contra ella, porque su maldad ha subido hasta Mí». "
  "1:3":
    - "Jonás se levantó, pero para huir a Tarsis, lejos de la presencia del Señor."
    - "Y descendiendo a Jope, encontró un barco que iba a Tarsis, pagó el pasaje y entró en él para ir con ellos a Tarsis, lejos de la presencia del Señor."
  "1:4":
    - "Pero el Señor desató sobre el mar un fuerte viento, y hubo una tempestad tan grande en el mar que el barco estuvo a punto de romperse. "
  "1:5":
    - "Los marineros tuvieron miedo y cada uno clamaba a su dios;"
    - "y arrojaron al mar la carga que estaba en el barco para aligerarlo. Pero Jonás había bajado a la bodega del barco, se había acostado y dormía profundamente. "
