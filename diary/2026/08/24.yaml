verses:
  "4:1":
    - "Pero esto desagradó a Jonás en gran manera, y se enojó."
  "4:2":
    - "Y oró al Señor: «¡Ah Señor! ¿No era esto lo que yo decía cuando aún estaba en mi tierra? Por eso me anticipé a huir a Tarsis."
    - "Porque yo sabía que Tú eres un Dios clemente y compasivo, lento para la ira y rico en misericordia, y que te arrepientes del mal anunciado."
  "4:3":
    - "Y ahora, oh Señor, te ruego que me quites la vida, porque mejor me es la muerte que la vida»."
  "4:4":
    - "Y el Señor dijo: «¿Tienes acaso razón para enojarte?»."
  "4:5":
    - "Entonces salió Jonás de la ciudad y se sentó al oriente de la misma."
    - "Allí se hizo un cobertizo y se sentó bajo la sombra de él, hasta ver qué sucedería en la ciudad."
