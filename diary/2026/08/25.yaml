verses:
  "4:6":
    - "Y el Señor Dios dispuso que una planta creciera sobre Jonás para que hiciera sombra sobre su cabeza y lo librara de su incomodidad."
    - "Y Jonás se alegró grandemente por la planta. "
  "4:7":
    - "Pero al rayar el alba del día siguiente Dios dispuso que un gusano atacara la planta, y esta se secó."
  "4:8":
    - "Y sucedió que al salir el sol, Dios dispuso un sofocante viento del este, y el sol hirió la cabeza de Jonás, así que él desfallecía,"
    - "y con toda su alma deseaba morir, y decía: «Mejor me es la muerte que la vida»."
  "4:9":
    - "Entonces Dios le preguntó a Jonás: «¿Tienes acaso razón para enojarte por causa de la planta?»."
    - "«Tengo mucha razón para enojarme hasta la muerte», le respondió."
  "4:10":
    - "Entonces el Señor le dijo: «Tú te apiadaste de la planta por la que no trabajaste ni hiciste crecer, que nació en una noche y en una noche pereció,"
  "4:11":
    - "¿y no he de apiadarme Yo de Nínive, la gran ciudad, en la que hay más de 120,000 personas que no saben distinguir entre su derecha y su izquierda,"
    - "y también muchos animales?»."
