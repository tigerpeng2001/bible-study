grammar:
  original_phrase: "no he de apiadarme Yo de Nínive"
  components:
    - token: "no"
      part_of_speech: "Adverb"
      definition: "Negation operator ('not')"
    - token: "he de"
      part_of_speech: "Auxiliary Verb Phrase"
      definition: "First-person singular present indicative of 'haber' + preposition 'de'"
      grammatical_function: "Forms a verbal periphrasis (haber de + infinitive) expressing obligation, expectation, or rhetorical necessity ('am I not to / should I not')"
    - token: "apiadarme"
      part_of_speech: "Pronominal Infinitive Verb"
      definition: "Verb 'apiadarse' (to take pity on / have compassion for) + first-person singular clitic pronoun 'me'"
      syntactic_role: "Direct complement of the verbal periphrasis 'he de'"
    - token: "Yo"
      part_of_speech: "Personal Pronoun"
      definition: "First-person singular subject pronoun ('I')"
      stylistic_function: "Capitalized for divine reverence; placed post-verbally for emphatic focus"
    - token: "de Nínive"
      part_of_speech: "Prepositional Complement"
      definition: "Preposition 'de' + proper noun 'Nínive'"
      syntactic_role: "Required regime complement (complemento de régimen) for 'apiadarse'"
  syntactic_structure:
    formula: "Negation + [Auxiliary Verb + Infinitive-Pronoun] + Subject (Emphatic) + Prepositional Object"
    word_order_variations:
      standard: "¿Yo no he de apiadarme de Nínive?"
      stylistic_inverted: "¿No he de apiadarme Yo de Nínive?"
    inversion_effect: "Placing the subject pronoun 'Yo' after the verb phrase heightens rhetorical emphasis, contrasting divine mercy with Jonah's reluctance."
  translations:
    word_for_word_literal: "Not have I to pity-myself I of Nineveh?"
    direct_grammatical: "Should I not have pity on Nineveh?"
    standard_biblical:
      text: "And should not I pity Nineveh...?"
      source: "[ESV](https://www.bible.com/bible/59/JON.4.ESV?parallel=103)"
